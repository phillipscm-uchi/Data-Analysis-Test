[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "textkit"
version = "0.1.0"
description = "Small text utilities (slugify, word_count, truncate, is_palindrome) plus a tiny CLI."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
textkit = "textkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
